<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmora | Hair Care Assessment</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="heading">
        <h1>✨ Cosmora</h1>
        <p>Personalized Hair Care Assessment</p>
    </div>

    <form id="hairForm">

        <div class="card">

            <div class="input-box">
                <label>🛌 Average Sleep (Hours/Day)</label>
                <input type="number" min="0" max="24" placeholder="e.g. 7">
            </div>

            <div class="input-box">
                <label>🧴 Shampoo Used</label>
                <input type="text" placeholder="Brand Name">
            </div>

            <div class="input-box">
                <label>🚿 Hair Wash Frequency (Times/Week)</label>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5+</option>
                </select>
            </div>

            <div class="input-box">
                <label>🥥 Hair Oil Used</label>
                <select>
                    <option>None (N/A)</option>
                    <option>Coconut Oil</option>
                    <option>Almond Oil</option>
                    <option>Castor Oil</option>
                    <option>Rosemary Oil</option>
                    <option>Argan Oil</option>
                    <option>Olive Oil</option>
                    <option>Mustard Oil</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-box">
                <label>🛏 Pillow Cover Material</label>
                <select>
                    <option>Cotton</option>
                    <option>Silk</option>
                    <option>Satin</option>
                    <option>Polyester</option>
                </select>
            </div>

            <div class="input-box">
                <label>💇 Hair Treatments</label>
                <select>
                    <option>None</option>
                    <option>Keratin</option>
                    <option>Smoothing</option>
                    <option>Rebonding</option>
                    <option>Botox</option>
                    <option>Coloring</option>
                    <option>Perming</option>
                </select>
            </div>

            <div class="input-box">
                <label>🔥 Hair Styling Tools Used?</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="input-box">
                <label>🛡 Heat Protectant Spray Used?</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="input-box">
                <label>🥩 Protein Intake</label>
                <select>
                    <option>Low</option>
                    <option>Moderate</option>
                    <option>High</option>
                </select>
            </div>

            <div class="input-box">
                <label>💧 Wash Hair with Normal Temperature Water?</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="input-box">
                <label>🏭 Exposure to Pollution</label>
                <select>
                    <option>Never</option>
                    <option>Rarely</option>
                    <option>Sometimes</option>
                    <option>Frequently</option>
                </select>
            </div>

            <div class="input-box">
                <label>🧴 Conditioner Used?</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="input-box">
                <label>🥗 Diet Type</label>
                <select>
                    <option>Vegetarian</option>
                    <option>Eggetarian</option>
                    <option>Non-Vegetarian</option>
                    <option>Vegan</option>
                </select>
            </div>

            <div class="input-box full">
                <label>📝 Describe Your Hair Concerns</label>
                <textarea rows="6"
                placeholder="Example: Hair fall, dandruff, itchy scalp, split ends, excessive dryness, oily scalp, hair thinning, premature greying etc..."></textarea>
            </div>

            <button>Analyze My Hair →</button>

        </div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
